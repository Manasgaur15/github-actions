name: DevSecOps Pipeline

on:
    push:
        branches: [main]

jobs:

#  CI
    code-quality:
        uses: ./.github/workflows/code-quality.yml
    
    security-scan:
        uses: ./.github/workflows/secrets-scan.yml

    dependency-scan:
        uses: ./.github/workflows/dependancy-scan.yml
    
    docker-lint:
        uses: ./.github/workflows/docker-lint.yml
    
    #Build once the security is completed successfully
    build-and-push:
        needs: [code-quality, security-scan, dependency-scan, docker-lint]
        uses: ./.github/workflows/docker-build-push.yml
        secrets: inherit
    trivy:
        needs: build-and-push
        uses: ./.github/workflows/image-scan.yml
