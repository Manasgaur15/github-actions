name: Dependancy Scan

on:
  workflow_call:

jobs:
    dependancy-check    :
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install pip-audit
              run: pip install pip-audit
              with:
                python-version: "3.12"
            
            - name: Audit dependencies
              run: pip-audit -r requirements.txt